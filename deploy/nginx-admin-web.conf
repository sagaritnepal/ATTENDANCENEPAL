# Nginx reverse proxy for admin-web (Next.js, running via PM2 on localhost:3000).
#
# Install:
#   sudo cp deploy/nginx-admin-web.conf /etc/nginx/sites-available/admin-web
#   sudo ln -s /etc/nginx/sites-available/admin-web /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.yourcompany.com   # adds TLS + auto-renew
#
# Replace admin.yourcompany.com below with your real domain first.

server {
    listen 80;
    server_name admin.yourcompany.com;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
